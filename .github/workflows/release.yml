name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true
      - name: verify annotated tag, main, and green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' internal/version/version.go)
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git fetch origin main --depth=1
          sha=$(git rev-parse HEAD)
          test "$sha" = "$(git rev-parse origin/main)"
          successes=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$sha&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          test "$successes" -ge 1
      - name: release tests
        run: |
          go test -race -count=1 ./...
          test "$(go list -m all)" = "github.com/mqlitehq/mqlite-go"
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: measure linked size
        run: ./tools/measure-size.sh | tee size.tsv
      - name: build archives
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist stage
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            name=mqlitec
            if [ "$goos" = windows ]; then name=mqlitec.exe; fi
            dir="stage/${goos}_${goarch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -buildvcs=false -trimpath \
              -ldflags='-s -w -buildid=' -o "$dir/$name" ./cmd/mqlitec
            cp LICENSE README.md "$dir/"
            if [ "$goos" = windows ]; then
              (cd "$dir" && zip -q "../../dist/mqlitec_${version}_${goos}_${goarch}.zip" "$name" LICENSE README.md)
            else
              tar -czf "dist/mqlitec_${version}_${goos}_${goarch}.tar.gz" -C "$dir" "$name" LICENSE README.md
            fi
          done
          ./stage/linux_amd64/mqlitec version
          go version -m ./stage/linux_amd64/mqlitec
          find dist -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed 's#  dist/#  #' > dist/SHA256SUMS
      - name: compose factual release notes
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          {
            printf '# mqlite-go %s\n\n' "$version"
            awk -v version="$version" '
              $0 ~ "^## v" version "([[:space:]]|$)" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            printf '\n### Linked size\n\nMeasured by the tagged commit with the current stable Go toolchain:\n\n```text\n'
            cat size.tsv
            printf '```\n'
          } > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bundle
          path: |
            dist
            size.tsv
            release-notes.md
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-bundle
          path: release-bundle
      - name: publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s release-bundle/release-notes.md
          test -s release-bundle/size.tsv
          test -s release-bundle/dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            release-bundle/dist/* release-bundle/size.tsv \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-bundle/release-notes.md
